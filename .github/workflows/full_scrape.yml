name: Weekly Full Scrape

on:
  schedule:
    # Sundays 03:00 UTC (= 03:00 GMT in winter / 04:00 BST in summer)
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # full scrape incl. selenium agents takes ~3 hours

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full scrape (fresh) + geocode + migrate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
        run: |
          python3 full_scrape.py

      - name: Upload logs as artifact
        if: always()  # Upload logs even if the job fails
        uses: actions/upload-artifact@v4
        with:
          name: weekly-full-scrape-logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 7
