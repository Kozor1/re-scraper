name: Hourly Property Update

on:
  schedule:
    # GitHub scheduled runs are best-effort with no SLA — top-of-hour works
    # worst, and single shots get randomly dropped. Fire twice per hour at
    # off-peak minutes; the concurrency group below makes the second a no-op
    # if the first is running or just succeeded.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  actions: read   # needed to list our own recent runs for the dedupe check

jobs:
  check-recent:
    # With two cron firings per hour, the second (47-past) is a backup for
    # when the first (17-past) gets dropped by GitHub's best-effort scheduler.
    # If the first succeeded, skip the whole heavy scrape.
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip if a successful run completed <50 min ago
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look at this workflow's last completed runs and their conclusions
          RESULT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/scrape.yml/runs?per_page=5&branch=main&created=>$(date -u -d '50 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --jq '[.workflow_runs[] | select(.event != "workflow_dispatch" and .conclusion == "success")] | length')
          if [ "$RESULT" -gt 0 ]; then
            echo "Recent successful run exists — skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check-recent
    # Manual triggers always run; scheduled backups skip when a sibling just ran.
    if: github.event_name == 'workflow_dispatch' || needs.check-recent.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for long scrapes
    # Prevent overlapping/concurrent updater processes; a queued duplicate
    # simply waits for the first to finish and then re-checks the state.
    concurrency:
      group: hourly-scrape
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore scraped data (properties/ + geocache)
        uses: actions/cache/restore@v4
        with:
          path: |
            properties/
            geocache.json
          key: scraper-data-${{ github.run_id }}
          restore-keys: scraper-data-

      - name: Run property update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
        run: |
          python3 property_update.py

      - name: Save scraped data cache
        uses: actions/cache/save@v4
        with:
          path: |
            properties/
            geocache.json
          key: scraper-data-${{ github.run_id }}

      - name: Upload logs as artifact
        if: always()  # Upload logs even if the job fails
        uses: actions/upload-artifact@v4
        with:
          name: hourly-scrape-logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 2
